[project]
site_name = "Dagster Adoption Guide"
site_description = "An introduction to Dagster with examples from CFA workflows."
site_author = "Kelly Reagan"
site_url = "https://cdcgov.github.io/cfa-dagster/"
output_dir = "./"
copyright = """
Copyright &copy; 2026 The authors
"""

nav = [
  { "Getting Started" = [
      "getting-started/overview.md",
      "getting-started/quickstart.md",
      "getting-started/installation.md",
      "getting-started/concepts.md",
      "getting-started/production.md"
    ] },
  { "Tutorials" = [
      "tutorial/image.md",
      "tutorial/azure.md",
      "tutorial/docker.md"
    ] },
  { "Examples" = [
      "examples/county-rt.md",
      "examples/nssp-etl.md",
      "examples/stf-forecasting.md"
    ] },
    { "API" = [
        "api.md"
    ] }

]

watch = [ "includes" ]

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = [".."]
options = {
  docstring_style = "google",
  inherited_members = true,
  # we probably don't want to inline the source code for brevity
  show_source = false,
  show_signature = true,
  show_signature_annotations = true,
  show_root_heading = true,
  # required to show dataclass attributes
  show_attributes = true,
  members = true,
  show_labels = true,
  # required to show dataclasses under submodules
  show_if_no_docstring = true,
  # required to show dynamic_graph_asset
  show_submodules = true,
  # filter out anything starting with _, or log, or T, but allow __init__
  filters = ["!^_", "!^log$", "!^T$", "__init__"],
}

[project.theme]

language = "en"

features = [
    "announce.dismiss",
    "content.tooltips",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.prune",
    "navigation.sections",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
    "toc.integrate",
]


[project.markdown_extensions.toc]
permalink = true

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

# together, these three extensions create tooltips
# for command abbreviations via definitions in
# `includes/abbreviations.md`
[project.markdown_extensions.abbr]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.pymdownx.snippets]
auto_append = [ "includes/abbreviations.md" ]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.mdx_truly_sane_lists]

[build]
site_dir = "/docs"
